name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze (typescript)
    runs-on: ubuntu-latest
    env:
      # Dummy value: prisma.config.ts requires DATABASE_URL during postinstall
      # (prisma generate); no database is contacted.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        # version intentionally omitted — resolved from "packageManager" in the root package.json
        uses: pnpm/action-setup@v4

      - name: Install foundry deps
        run: pnpm install --frozen-lockfile
        working-directory: foundry

      - name: Install ui deps
        run: npm ci
        working-directory: ui

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
